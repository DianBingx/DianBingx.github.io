<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta name="description" content="DianBingx 的个人主页" />
    <title>DianBingx · 个人主页</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="profile-name">
        <a class="avatar-link" href="https://github.com/DianBingx" aria-label="访问 DianBingx 的 GitHub">
          <span class="avatar-fallback" aria-hidden="true">D</span>
          <img class="avatar" src="https://github.com/DianBingx.png?size=240" alt="DianBingx 的 GitHub 头像" width="96" height="96" />
          <span class="github-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.769-.244.769-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.078-.685.078-.685 1.13.08 1.725 1.16 1.725 1.16 1.005 1.722 2.637 1.225 3.28.937.102-.728.393-1.225.715-1.507-2.499-.284-5.126-1.25-5.126-5.566 0-1.23.44-2.233 1.16-3.02-.117-.285-.503-1.43.11-2.98 0 0 .945-.302 3.094 1.153A10.8 10.8 0 0 1 12 6.176c.956.004 1.919.13 2.818.379 2.148-1.455 3.09-1.153 3.09-1.153.616 1.55.23 2.695.114 2.98.722.787 1.158 1.79 1.158 3.02 0 4.327-2.631 5.279-5.138 5.557.404.35.766 1.043.766 2.101 0 1.518-.014 2.743-.014 3.115 0 .3.203.651.774.54A11.25 11.25 0 0 0 12 .75Z" /></svg>
          </span>
        </a>
        <h1 id="profile-name">DianBingx<span class="name-dot" aria-hidden="true">.</span></h1>
        <p class="welcome">欢迎来到我的小小世界</p>
        <form class="invitation" novalidate>
          <label for="invitation-code">邀请码</label>
          <div class="input-wrap">
            <svg class="key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4.5" /><path d="m11.2 11.2 9.3 9.3m-4-4 2.5-2.5m-5 0 2.5-2.5" /></svg>
            <input id="invitation-code" name="invitation-code" type="text" placeholder="请输入邀请码" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" aria-describedby="invitation-status" />
            <button class="enter-button" type="submit" aria-label="验证邀请码并进入">→</button>
          </div>
          <p id="invitation-status" class="invitation-status" role="status" aria-live="polite">输入邀请码，开启新的发现</p>
        </form>
      </section>
    </main>
    <footer><a href="https://github.com/DianBingx">GITHUB <span aria-hidden="true">↗</span></a></footer>
    <script type="module" src="./assets/Music/scripts/invitation.js"></script>
  </body>
</html>
